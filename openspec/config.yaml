schema: spec-driven

context: |
  been — статическая карта поездок на Vite, React, TypeScript и Yandex Maps API 2.1.
  Пакетный менеджер — Yarn Classic. Серверной части и базы данных нет.
  Деплой — GitHub Pages по пути /been/; сохранять base и загрузку ресурсов через import.meta.env.BASE_URL.
  Локации находятся в src/VISITED_*.ts, посещенные территории — в src/VISITED_REGIONS.ts.
  Координаты имеют порядок [latitude, longitude]. Границы хранятся в public/countries.json и public/regions.json.
  Карта создается императивно; защита от повторной инициализации нужна для React StrictMode.
  Подробные ограничения и порядок работы описаны в AGENTS.md; прочитать его перед изменениями.
  Артефакты писать по-русски. Структурные заголовки OpenSpec, SHALL/MUST и WHEN/THEN сохранять на английском.

rules:
  proposal:
    - Указать затронутые возможности, файлы и влияние на существующее поведение; не расширять задачу без необходимости.
  specs:
    - Описывать наблюдаемое поведение и проверяемые сценарии, без привязки к внутренним функциям.
    - Не фиксировать текущие количества посещений как константы; описывать правила подсчета.
  design:
    - Выбирать минимальное решение на существующем стеке; учитывать размер границ и стоимость инициализации при изменении карты.
  tasks:
    - У каждой задачи указать способ проверки; включить yarn build и openspec validate --all --strict --no-interactive.
    - Для изменений карты включить проверку затронутых сценариев в браузере; не добавлять тестовый фреймворк ради документации.

operations:
  apply:
    guidance:
      - Не запускать yarn lint для проверки без необходимости, поскольку он изменяет файлы через --fix.
      - Перед передачей результата выполнить yarn build и openspec validate --all --strict --no-interactive; сообщить о непроверенных сценариях.
  archive:
    guidance:
      - До архивации проверить выполнение задач и результаты проверок; синхронизировать только реализованные требования.
